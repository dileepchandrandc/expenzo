spring:
  application:
    name: transaction-services
  datasource:
    url: jdbc:postgresql://localhost:5432/swift?currentSchema=transaction
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
server:
  port: 8081
  servlet:
    context-path: /transaction-services
expenzo:
  event:
    kafka-topic:
      raw-transaction: ${ENV_RAW_TRANSACTION_TOPIC:raw-transactions}
