// Root aggregator build for the expenzo-services multi-module project.
// Each Spring Boot / library module is configured in its own build.gradle.

allprojects {
	group = 'com.expenzo'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
		maven { url = 'https://repo.spring.io/snapshot' }
	}
}

subprojects {
	apply plugin: 'java'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	tasks.withType(JavaCompile) {
		options.encoding = 'UTF-8'
		// Spring resolves method parameter names (e.g. @PathVariable, @RequestParam)
		// from this flag; required across all subprojects.
		options.compilerArgs += '-parameters'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}
